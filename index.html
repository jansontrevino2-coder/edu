<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UniversalGMS Launcher</title>

<style>
:root {
    --bg: #08080e;
    --panel: rgba(18, 18, 31, 0.72);

    --accent: #8b5cf6;
    --accent-light: #a78bfa;
    --accent-dark: #6d28d9;

    --blue: #6366f1;
    --blue-dark: #3730a3;

    --text: #ffffff;
    --muted: #9ca3af;

    --border:
        rgba(255, 255, 255, 0.08);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    min-height: 100%;
}

body {
    position: relative;

    min-height: 100vh;

    padding: 24px;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow-x: hidden;

    color: var(--text);

    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        radial-gradient(
            850px circle at 50% 20%,
            rgba(139, 92, 246, 0.28),
            transparent 60%
        ),
        radial-gradient(
            700px circle at -10% 90%,
            rgba(109, 40, 217, 0.13),
            transparent 65%
        ),
        radial-gradient(
            600px circle at 110% 90%,
            rgba(99, 102, 241, 0.10),
            transparent 65%
        ),
        var(--bg);
}

/* =====================================================
   BACKGROUND
===================================================== */

.background-grid {
    position: fixed;
    inset: 0;

    pointer-events: none;

    opacity: 0.16;

    background-image:
        linear-gradient(
            rgba(255, 255, 255, 0.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.025) 1px,
            transparent 1px
        );

    background-size:
        45px 45px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 85%
        );
}

.orb {
    position: fixed;

    border-radius: 50%;

    pointer-events: none;

    filter: blur(100px);
}

.orb-one {
    top: -120px;
    left: 50%;

    width: 500px;
    height: 350px;

    transform:
        translateX(-50%);

    background:
        rgba(139, 92, 246, 0.19);

    animation:
        glowPulse
        7s
        ease-in-out
        infinite;
}

.orb-two {
    bottom: -220px;
    left: -150px;

    width: 500px;
    height: 500px;

    background:
        rgba(109, 40, 217, 0.11);
}

.orb-three {
    right: -180px;
    bottom: -180px;

    width: 450px;
    height: 450px;

    background:
        rgba(79, 70, 229, 0.09);
}

/* =====================================================
   LAUNCHER
===================================================== */

.launcher {
    position: relative;
    z-index: 10;

    width: 100%;
    max-width: 540px;

    padding:
        46px
        42px
        36px;

    overflow: hidden;

    text-align: center;

    border:
        1px solid
        var(--border);

    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            rgba(27, 27, 47, 0.78),
            rgba(13, 13, 23, 0.84)
        );

    box-shadow:
        0 35px 80px
        rgba(0, 0, 0, 0.48),
        0 0 60px
        rgba(139, 92, 246, 0.10),
        inset 0 1px 0
        rgba(255, 255, 255, 0.04);

    backdrop-filter:
        blur(28px);

    animation:
        launcherAppear
        0.7s
        cubic-bezier(
            0.18,
            0.89,
            0.32,
            1.15
        )
        both;
}

.launcher::before {
    content: "";

    position: absolute;

    top: 0;
    left: 50%;

    width: 65%;
    height: 1px;

    transform:
        translateX(-50%);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(167, 139, 250, 0.9),
            transparent
        );

    box-shadow:
        0 0 18px
        rgba(139, 92, 246, 0.8);
}

.launcher::after {
    content: "";

    position: absolute;

    top: -100px;
    left: 50%;

    width: 280px;
    height: 180px;

    transform:
        translateX(-50%);

    background:
        rgba(139, 92, 246, 0.18);

    border-radius: 50%;

    filter:
        blur(70px);

    pointer-events: none;
}

/* =====================================================
   LOGO
===================================================== */

.logo-container {
    position: relative;
    z-index: 2;

    width: 92px;
    height: 92px;

    margin:
        0
        auto
        19px;

    display: flex;
    align-items: center;
    justify-content: center;

    border:
        1px solid
        rgba(167, 139, 250, 0.20);

    border-radius: 27px;

    font-size: 3.8rem;

    background:
        linear-gradient(
            145deg,
            rgba(139, 92, 246, 0.16),
            rgba(139, 92, 246, 0.04)
        );

    box-shadow:
        0 14px 35px
        rgba(0, 0, 0, 0.26),
        0 0 35px
        rgba(139, 92, 246, 0.12);

    animation:
        logoFloat
        4s
        ease-in-out
        infinite;
}

.logo-glow {
    position: absolute;

    inset: 15px;

    border-radius: 50%;

    background:
        rgba(139, 92, 246, 0.24);

    filter:
        blur(25px);

    z-index: -1;
}

/* =====================================================
   BRAND
===================================================== */

.title {
    position: relative;
    z-index: 2;

    margin-bottom: 10px;

    font-size:
        clamp(2.6rem, 9vw, 3.7rem);

    font-weight: 900;

    line-height: 1;

    letter-spacing: -3px;

    background:
        linear-gradient(
            135deg,
            #ffffff 8%,
            #ddd6fe 43%,
            #a78bfa 70%,
            #7c3aed 100%
        );

    background-clip: text;
    -webkit-background-clip: text;

    color: transparent;
    -webkit-text-fill-color: transparent;

    filter:
        drop-shadow(
            0 0 24px
            rgba(139, 92, 246, 0.15)
        );
}

.subtitle {
    margin-bottom: 6px;

    color:
        #d1d5db;

    font-size: 1rem;
    font-weight: 600;
}

.description {
    max-width: 390px;

    margin:
        0
        auto;

    color:
        var(--muted);

    font-size: 0.86rem;
    line-height: 1.55;
}

/* =====================================================
   STATUS BADGE
===================================================== */

.status-badge {
    display: inline-flex;
    align-items: center;

    gap: 8px;

    margin-top: 18px;

    padding:
        8px
        13px;

    border:
        1px solid
        rgba(139, 92, 246, 0.20);

    border-radius: 999px;

    color:
        #c4b5fd;

    font-size: 12px;
    font-weight: 700;

    background:
        rgba(139, 92, 246, 0.08);
}

.status-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background:
        #a78bfa;

    box-shadow:
        0 0 10px
        rgba(167, 139, 250, 0.9);

    animation:
        statusPulse
        2s
        ease-in-out
        infinite;
}

/* =====================================================
   DIVIDER
===================================================== */

.divider {
    width: 100%;
    height: 1px;

    margin:
        28px
        0;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255, 255, 255, 0.08),
            transparent
        );
}

/* =====================================================
   BUTTONS
===================================================== */

.actions {
    display: flex;
    flex-direction: column;

    gap: 12px;
}

.launch-btn,
.download-btn {
    position: relative;

    width: 100%;

    min-height: 58px;

    padding:
        13px
        18px;

    display: flex;
    align-items: center;

    gap: 14px;

    overflow: hidden;

    border: none;

    border-radius: 15px;

    cursor: pointer;

    color: white;

    text-align: left;

    transition:
        transform 0.22s ease,
        box-shadow 0.22s ease,
        filter 0.22s ease,
        border-color 0.22s ease;
}

.launch-btn {
    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #6d28d9
        );

    box-shadow:
        0 10px 30px
        rgba(109, 40, 217, 0.28);
}

.download-btn {
    border:
        1px solid
        rgba(255, 255, 255, 0.07);

    background:
        linear-gradient(
            135deg,
            rgba(79, 70, 229, 0.94),
            rgba(49, 46, 129, 0.94)
        );

    box-shadow:
        0 10px 30px
        rgba(49, 46, 129, 0.25);
}

.launch-btn::before,
.download-btn::before {
    content: "";

    position: absolute;

    top: 0;
    left: -110%;

    width: 70%;
    height: 100%;

    transform:
        skewX(-25deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255, 255, 255, 0.17),
            transparent
        );

    transition:
        left 0.55s ease;
}

.launch-btn:hover::before,
.download-btn:hover::before {
    left: 150%;
}

.launch-btn:hover {
    transform:
        translateY(-3px)
        scale(1.01);

    filter:
        brightness(1.08);

    box-shadow:
        0 18px 40px
        rgba(109, 40, 217, 0.40);
}

.download-btn:hover {
    transform:
        translateY(-3px)
        scale(1.01);

    filter:
        brightness(1.08);

    box-shadow:
        0 18px 40px
        rgba(49, 46, 129, 0.38);
}

.launch-btn:active,
.download-btn:active {
    transform:
        translateY(0)
        scale(0.985);
}

.button-icon {
    flex-shrink: 0;

    width: 36px;
    height: 36px;

    display: grid;
    place-items: center;

    border-radius: 10px;

    font-size: 18px;

    background:
        rgba(255, 255, 255, 0.12);
}

.button-content {
    flex: 1;

    min-width: 0;

    display: flex;
    flex-direction: column;

    gap: 2px;
}

.button-title {
    font-size: 14px;
    font-weight: 800;
}

.button-description {
    color:
        rgba(255, 255, 255, 0.68);

    font-size: 11px;
    font-weight: 500;
}

.button-arrow {
    flex-shrink: 0;

    color:
        rgba(255, 255, 255, 0.72);

    font-size: 19px;

    transition:
        transform 0.2s;
}

.launch-btn:hover .button-arrow {
    transform:
        translateX(4px);
}

.download-btn:hover .button-arrow {
    transform:
        translateY(3px);
}

/* =====================================================
   FOOTER
===================================================== */

.footer {
    margin-top: 26px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 7px;

    color:
        #666675;

    font-size: 12px;
}

.footer-dot {
    width: 3px;
    height: 3px;

    border-radius: 50%;

    background:
        #52525b;
}

/* =====================================================
   ANIMATIONS
===================================================== */

@keyframes launcherAppear {

    from {
        opacity: 0;

        transform:
            translateY(25px)
            scale(0.97);
    }

    to {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }

}

@keyframes logoFloat {

    0%,
    100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-6px);
    }

}

@keyframes glowPulse {

    0%,
    100% {
        opacity: 0.75;

        transform:
            translateX(-50%)
            scale(1);
    }

    50% {
        opacity: 1;

        transform:
            translateX(-50%)
            scale(1.08);
    }

}

@keyframes statusPulse {

    0%,
    100% {
        opacity: 0.65;

        box-shadow:
            0 0 6px
            rgba(167, 139, 250, 0.7);
    }

    50% {
        opacity: 1;

        box-shadow:
            0 0 14px
            rgba(167, 139, 250, 1);
    }

}

/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    body {
        padding: 16px;
    }

    .launcher {
        padding:
            35px
            20px
            28px;

        border-radius:
            23px;
    }

    .logo-container {
        width: 78px;
        height: 78px;

        border-radius:
            22px;

        font-size:
            3.1rem;
    }

    .title {
        font-size:
            2.65rem;

        letter-spacing:
            -2px;
    }

    .subtitle {
        font-size:
            0.93rem;
    }

    .description {
        font-size:
            0.8rem;
    }

    .button-description {
        font-size:
            10px;
    }

}

@media (max-width: 360px) {

    .button-description {
        display: none;
    }

}

</style>
</head>

<body>

<div class="background-grid"></div>

<div class="orb orb-one"></div>
<div class="orb orb-two"></div>
<div class="orb orb-three"></div>


<main class="launcher">

    <div class="logo-container">

        <div class="logo-glow"></div>

        🎮

    </div>


    <h1 class="title">
        UniversalGMS
    </h1>


    <div class="subtitle">
        Universal Game Hub
    </div>


    <p class="description">
        
    </p>


    <div class="status-badge">

        <span class="status-dot"></span>

        UniversalGMS Ready

    </div>


    <div class="divider"></div>


    <div class="actions">


        <button
            class="launch-btn"
            type="button"
            onclick="launchHub()"
        >

            <span class="button-icon">
                🚀
            </span>

            <span class="button-content">

                <span class="button-title">
                    Launch UniversalGMS
                </span>

                <span class="button-description">
                    Open UniversalGMS
                </span>

            </span>

            <span class="button-arrow">
                →
            </span>

        </button>


        <button
            class="download-btn"
            type="button"
            onclick="downloadHub()"
        >

            <span class="button-icon">
                ↓
            </span>

            <span class="button-content">

                <span class="button-title">
                    Download Hub
                </span>

                <span class="button-description">
                    Download
                </span>

            </span>

            <span class="button-arrow">
                ↓
            </span>

        </button>


    </div>


    <div class="footer">

        <span>
            UniversalGMS
        </span>

        <span class="footer-dot"></span>

        <span>
            Launcher
        </span>

    </div>

</main>


<script>

function launchHub() {

    window.open(
        "https://universaledu.vercel.app/hub.html",
        "_blank",
        "noopener,noreferrer"
    );

}


function downloadHub() {

    const link =
        document.createElement(
            "a"
        );

    link.href =
        "/hub-offline.html";

    link.download =
        "UniversalGMS-Hub-offline.html";

    document.body.appendChild(
        link
    );

    link.click();

    link.remove();

}


/*
Keyboard shortcut:

ENTER = launch the hub
*/

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            launchHub();

        }

    }
);

</script>

</body>
</html>
