<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Database</title>

<style>
:root{
    --bg:#121212;
    --card:#1e1e1e;
    --accent:#fc6d26;
    --text:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Arial,sans-serif;
    padding:20px;
}

header{
    text-align:center;
    margin-bottom:30px;
}

h1{
    color:var(--accent);
}

#status{
    margin-top:10px;
    color:#aaa;
}

#game-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:20px;
    max-width:1400px;
    margin:auto;
}

.game-card{
    background:var(--card);
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.3);
    transition:.2s;
}

.game-card:hover{
    transform:translateY(-5px);
}

.game-cover{
    width:100%;
    height:160px;
    object-fit:cover;
}

.game-info{
    padding:15px;
}

.game-title{
    font-size:16px;
    font-weight:bold;
    margin-bottom:12px;
}

.play-btn{
    width:100%;
    border:none;
    background:var(--accent);
    color:white;
    padding:10px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}
</style>
</head>
<body>

<header>
    <h1>🎮 Game Database</h1>
    <div id="status">Scanning Games...</div>
</header>

<div id="game-grid"></div>

<script>

// CHANGE THESE
const GITHUB_OWNER = "YOUR_GITHUB_USERNAME";
const GITHUB_REPO = "YOUR_REPOSITORY_NAME";
const GAMES_FOLDER = "Games";

async function loadGames() {

    const status =
        document.getElementById("status");

    const grid =
        document.getElementById("game-grid");

    try {

        const foldersResponse =
            await fetch(
                `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GAMES_FOLDER}`
            );

        const folders =
            await foldersResponse.json();

        const games = [];

        for (const folder of folders) {

            if (folder.type !== "dir")
                continue;

            const filesResponse =
                await fetch(folder.url);

            const files =
                await filesResponse.json();

            const html =
                files.find(file =>
                    file.name
                        .toLowerCase()
                        .endsWith(".html")
                );

            const cover =
                files.find(file =>
                    /\.(png|jpg|jpeg|webp|gif)$/i
                    .test(file.name)
                );

            if (!html) continue;

            games.push({
                name: folder.name,
                cover: cover
                    ? cover.download_url
                    : "https://via.placeholder.com/400x250?text=No+Cover",
                pageUrl:
                    `/Games/${encodeURIComponent(folder.name)}/${encodeURIComponent(html.name)}`
            });
        }

        status.textContent =
            `${games.length} games found`;

        grid.innerHTML = "";

        games.forEach(game => {

            const card =
                document.createElement("div");

            card.className =
                "game-card";

            card.innerHTML = `
                <img
                    class="game-cover"
                    src="${game.cover}"
                >

                <div class="game-info">
                    <div class="game-title">
                        ${game.name}
                    </div>

                    <button
                        class="play-btn"
                        onclick="window.location.href='${game.pageUrl}'">
                        ▶ Play
                    </button>
                </div>
            `;

            grid.appendChild(card);
        });

    } catch (error) {

        console.error(error);

        status.textContent =
            "Failed to scan games";
    }
}

loadGames();

</script>

</body>
</html>
