<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Database</title>

<style>
:root{
    --bg:#121212;
    --card:#1e1e1e;
    --accent:#fc6d26;
    --text:#fff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Arial,sans-serif;
    padding:20px;
}

header{
    text-align:center;
    margin-bottom:30px;
}

h1{
    color:var(--accent);
    margin-bottom:10px;
}

#status{
    color:#aaa;
}

#game-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:20px;
    max-width:1400px;
    margin:auto;
}

.game-card{
    background:var(--card);
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.3);
    transition:.2s;
}

.game-card:hover{
    transform:translateY(-5px);
}

.game-cover{
    width:100%;
    height:160px;
    object-fit:cover;
    background:#333;
}

.game-info{
    padding:15px;
}

.game-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:12px;
}

.play-btn{
    width:100%;
    border:none;
    padding:10px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    background:var(--accent);
    color:white;
}

.play-btn:hover{
    opacity:.9;
}

/* PLAYER */

#player-container{
    display:none;
    flex-direction:column;
    gap:10px;
    max-width:1400px;
    margin:auto;
}

.player-bar{
    display:flex;
    gap:10px;
}

.player-bar button{
    border:none;
    padding:10px 15px;
    border-radius:8px;
    background:var(--accent);
    color:white;
    cursor:pointer;
    font-weight:bold;
}

.player-bar button:hover{
    opacity:.9;
}

#game-frame{
    width:100%;
    height:85vh;
    border:none;
    border-radius:12px;
    background:black;
}
</style>
</head>
<body>

<header id="main-header">
    <h1>🎮 Game Database</h1>
    <div id="status">Scanning games...</div>
</header>

<div id="game-grid"></div>

<div id="player-container">

    <div class="player-bar">
        <button onclick="exitGame()">
            ⬅ Exit Game
        </button>

        <button onclick="fullscreenGame()">
            ⛶ Fullscreen
        </button>
    </div>

    <iframe
        id="game-frame"
        allowfullscreen
    ></iframe>

</div>

<script>

async function loadGames(){

    const status =
        document.getElementById("status");

    try{

        const response =
            await fetch("/api/games");

        if(!response.ok){
            throw new Error("API Error");
        }

        const games =
            await response.json();

        status.textContent =
            `${games.length} games found`;

        renderGames(games);

    }catch(error){

        console.error(error);

        status.textContent =
            "Failed to load games";
    }
}

function renderGames(games){

    const grid =
        document.getElementById("game-grid");

    grid.innerHTML = "";

    games.forEach(game=>{

        const card =
            document.createElement("div");

        card.className = "game-card";

        card.innerHTML = `
            <img
                class="game-cover"
                src="${game.cover}"
                alt="${game.name}"
                onerror="this.src='https://via.placeholder.com/400x250?text=No+Cover'"
            >

            <div class="game-info">

                <div class="game-title">
                    ${game.name}
                </div>

                <button
                    class="play-btn"
                    onclick="playGame('${game.url}')">
                    ▶ Play
                </button>

            </div>
        `;

        grid.appendChild(card);

    });
}

function playGame(url){

    document.getElementById("main-header").style.display = "none";

    document.getElementById("game-grid").style.display = "none";

    document.getElementById("player-container").style.display = "flex";

    document.getElementById("game-frame").src = url;
}

    document.getElementById("player-container").style.display
