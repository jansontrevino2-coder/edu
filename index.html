<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniversalGMS Launcher</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial,sans-serif;

    background:
        radial-gradient(circle at center,
        rgba(139,92,246,.35),
        transparent 40%),
        #0f0f1a;

    color:white;
}

.launcher{
    width:450px;
    text-align:center;

    padding:40px;

    border-radius:24px;

    background:rgba(255,255,255,.05);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.1);

    box-shadow:0 0 40px rgba(139,92,246,.3);
}

.logo{
    font-size:5rem;
}

.title{
    font-size:3rem;
    font-weight:900;
    margin-top:10px;

    background:
        linear-gradient(
            135deg,
            #fff,
            #c4b5fd,
            #8b5cf6
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.subtitle{
    color:#aaa;
    margin:20px 0;
}

.launch-btn{
    width:100%;

    border:none;

    padding:16px;

    border-radius:14px;

    cursor:pointer;

    color:white;

    font-size:1rem;
    font-weight:bold;

    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #6d28d9
        );
}

.launch-btn:hover{
    filter:brightness(1.1);
}
</style>
</head>
<body>

<div class="launcher">

    <div class="logo">🎮</div>

    <div class="title">
        UniversalGMS
    </div>

    <div class="subtitle">
        Your Universal Gaming Hub
    </div>

    <button
        class="launch-btn"
        onclick="launchHub()">

        🚀 Launch UniversalGMS

    </button>

</div>

<script>

function launchHub(){

    window.open(
        "/hub.html",
        "_blank"
    );

}

</script>

</body>
</html>
