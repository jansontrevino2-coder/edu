<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UniversalGMS Launcher</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Inter, Arial, sans-serif;

    background:
        radial-gradient(
            circle at center,
            rgba(139,92,246,.35),
            transparent 40%
        ),
        #0f0f1a;

    color:white;
}

.launcher{

    width:450px;

    text-align:center;

    padding:40px;

    border-radius:24px;

    background:rgba(255,255,255,.05);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.1);

    box-shadow:
        0 0 40px rgba(139,92,246,.3);
}

.logo{
    font-size:4rem;
    margin-bottom:15px;
}

.title{
    font-size:2.8rem;
    font-weight:900;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #d8b4fe,
            #8b5cf6
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    margin-bottom:10px;
}

.subtitle{
    color:#a1a1aa;

    margin-bottom:30px;
}

.launch-btn{

    width:100%;

    border:none;

    padding:16px;

    border-radius:14px;

    cursor:pointer;

    color:white;

    font-size:1rem;
    font-weight:700;

    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #6d28d9
        );

    transition:.2s;
}

.launch-btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 0 25px rgba(139,92,246,.4);
}

.footer{
    margin-top:20px;

    color:#71717a;

    font-size:.9rem;
}

</style>
</head>
<body>

<div class="launcher">

    <div class="logo">
        🎮
    </div>

    <div class="title">
        UniversalGMS
    </div>

    <div class="subtitle">
        Your Universal Gaming Hub
    </div>

    <button
        class="launch-btn"
        onclick="launchHub()">

        🚀 Launch UniversalGMS

    </button>

    <div class="footer">
        Click Launch to open UniversalGMS
    </div>

</div>

<script>

function launchHub(){

    const popup =
        window.open("about:blank","_blank");

    if(!popup){
        alert(
            "Please allow popups for UniversalGMS."
        );
        return;
    }

    popup.document.write(`
<!DOCTYPE html>
<html>
<head>
<title>UniversalGMS</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

iframe{
    width:100%;
    height:100%;
    border:none;
}
</style>

</head>

<body>

<iframe
    src="/hub.html"
    allowfullscreen>
</iframe>

</body>
</html>
    `);

    popup.document.close();
}

</script>

</body>
</html>
