<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Database</title>

<style>
:root{
    --bg:#121212;
    --card:#1e1e1e;
    --accent:#fc6d26;
    --text:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Arial,sans-serif;
    padding:20px;
}

header{
    text-align:center;
    margin-bottom:25px;
}

h1{
    color:var(--accent);
    margin-bottom:10px;
}

#status{
    color:#aaa;
    margin-bottom:15px;
}

#search{
    width:100%;
    max-width:600px;
    padding:12px;
    border:none;
    outline:none;
    border-radius:10px;
    background:#232323;
    color:white;
    font-size:16px;
}

#game-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:20px;
    max-width:1500px;
    margin:auto;
}

.game-card{
    background:var(--card);
    border-radius:12px;
    overflow:hidden;
    transition:.2s;
    box-shadow:0 4px 12px rgba(0,0,0,.3);
}

.game-card:hover{
    transform:translateY(-5px);
}

.game-cover{
    width:100%;
    height:160px;
    object-fit:cover;
}

.game-info{
    padding:15px;
}

.game-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}

.play-btn{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    background:var(--accent);
    color:white;
    cursor:pointer;
    font-weight:bold;
}

.play-btn:hover{
    opacity:.9;
}

/* PLAYER */

#player-container{
    display:none;
    flex-direction:column;
    gap:10px;
    max-width:1600px;
    margin:auto;
}

.player-bar{
    display:flex;
    gap:10px;
}

.player-btn{
    border:none;
    background:var(--accent);
    color:white;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

#game-frame{
    width:100%;
    height:85vh;
    border:none;
    border-radius:12px;
    background:black;
}
</style>
</head>
<body>

<header id="header">
    <h1>🎮 Game Database</h1>

    <div id="status">
        Scanning games...
    </div>

    <input
        type="text"
        id="search"
        placeholder="Search games..."
    >
</header>

<div id="game-grid"></div>

<div id="player-container">

    <div class="player-bar">

        <button
            class="player-btn"
            onclick="exitGame()">
            ⬅ Exit Game
        </button>

        <button
            class="player-btn"
            onclick="fullscreenGame()">
            ⛶ Fullscreen
        </button>

    </div>

    <iframe
        id="game-frame"
        allowfullscreen>
    </iframe>

</div>

<script>

let allGames = [];

async function loadGames(){

    try{

        const response =
            await fetch("/api/games");

        const games =
            await response.json();

        allGames = games;

        document.getElementById("status")
            .textContent =
            `${games.length} games found`;

        renderGames(games);

    }catch(error){

        console.error(error);

        document.getElementById("status")
            .textContent =
            "Failed to load games";
    }
}

function renderGames(games){

    const grid =
        document.getElementById("game-grid");

    grid.innerHTML = "";

    games.forEach(game=>{

        const card =
            document.createElement("div");

        card.className = "game-card";

        card.innerHTML = `
            <img
                class="game-cover"
                src="${game.cover}"
                alt="${game.name}"
                onerror="this.src='https://via.placeholder.com/400x250?text=No+Cover'"
            >

            <div class="game-info">

                <div class="game-title">
                    ${game.name}
                </div>

                <button
                    class="play-btn"
                    onclick="playGame('${game.url}')">
                    ▶ Play
                </button>

            </div>
        `;

        grid.appendChild(card);
    });
}

function playGame(url){

    document.getElementById("header")
        .style.display = "none";

    document.getElementById("game-grid")
        .style.display = "none";

    document.getElementById("player-container")
        .style.display = "flex";

    document.getElementById("game-frame")
        .src = url;
}

function exitGame(){

    const frame =
        document.getElementById("game-frame");

    frame.src = "";

    document.getElementById("player-container")
        .style.display = "none";

    document.getElementById("header")
        .style.display = "block";

    document.getElementById("game-grid")
        .style.display = "grid";
}

function fullscreenGame(){

    const frame =
        document.getElementById("game-frame");

    if(frame.requestFullscreen){
        frame.requestFullscreen();
    }
    else if(frame.webkitRequestFullscreen){
        frame.webkitRequestFullscreen();
    }
}

document
.getElementById("search")
.addEventListener("input", e=>{

    const q =
        e.target.value.toLowerCase();

    renderGames(
        allGames.filter(game =>
            game.name.toLowerCase().includes(q)
        )
    );
});

loadGames();

</script>

</body>
</html>
