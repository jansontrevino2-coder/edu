<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UniversalGMS Launcher</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial,sans-serif;

    background:
        radial-gradient(
            circle at center,
            rgba(139,92,246,.35),
            transparent 40%
        ),
        #0f0f1a;

    color:white;
}

.launcher{

    width:500px;

    text-align:center;

    padding:40px;

    border-radius:24px;

    background:rgba(255,255,255,.05);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.1);

    box-shadow:
        0 0 40px rgba(139,92,246,.3);
}

.logo{
    font-size:5rem;
    margin-bottom:10px;
}

.title{

    font-size:3rem;
    font-weight:900;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #d8b4fe,
            #8b5cf6
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    margin-bottom:10px;
}

.subtitle{
    color:#a1a1aa;
    margin-bottom:25px;
}

.launch-btn{

    width:100%;

    border:none;

    padding:16px;

    border-radius:14px;

    cursor:pointer;

    color:white;

    font-size:1rem;
    font-weight:bold;

    margin-bottom:12px;

    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #6d28d9
        );
}

.launch-btn:hover{
    filter:brightness(1.1);
}

.download-btn{

    width:100%;

    border:none;

    padding:16px;

    border-radius:14px;

    cursor:pointer;

    color:white;

    font-size:1rem;
    font-weight:bold;

    background:
        linear-gradient(
            135deg,
            #4f46e5,
            #312e81
        );
}

.download-btn:hover{
    filter:brightness(1.1);
}

.footer{

    margin-top:20px;

    color:#71717a;

    font-size:.9rem;
}

</style>
</head>
<body>

<div class="launcher">

    <div class="logo">
        🎮
    </div>

    <div class="title">
        UniversalGMS
    </div>

    <div class="subtitle">
        Your Universal Gaming Hub
    </div>

    <button
        class="launch-btn"
        onclick="launchHub()">

        🚀 Launch UniversalGMS

    </button>

    <button
        class="download-btn"
        onclick="downloadHub()">

        ⬇ Download Hub

    </button>

    <div class="footer">
        UniversalGMS Launcher
    </div>

</div>

<script>

function launchHub(){

    window.open(
        "/hub.html",
        "_blank"
    );

}

function downloadHub(){

    const link =
        document.createElement("a");

    link.href = "/hub.html";

    link.download =
        "UniversalGMS-Hub.html";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

}

</script>

</body>
</html>
