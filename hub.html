<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniversalGMS</title>

<style>
:root{
    --bg:#0f0f1a;
    --card:#1f1f33;
    --accent:#8b5cf6;
    --accent2:#6d28d9;
    --text:#ffffff;
    --muted:#a1a1aa;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    padding:20px;
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at top,
        rgba(139,92,246,.25),
        transparent 40%),
        var(--bg);
    color:var(--text);
}

/* HEADER */

header{
    text-align:center;
    margin-bottom:25px;
}

.logo{
    font-size:3.5rem;
    font-weight:900;
    margin-bottom:10px;

    background:
    linear-gradient(
        135deg,
        #fff,
        #c4b5fd,
        #8b5cf6
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.subtitle{
    color:var(--muted);
    margin-bottom:15px;
}

#status{
    color:var(--muted);
    margin-bottom:15px;
}

#search{
    width:100%;
    max-width:700px;

    padding:14px;

    border:none;
    outline:none;

    border-radius:12px;

    background:#1b1b2f;
    color:white;
}

/* GRID */

#game-grid{
    max-width:1900px;
    margin:auto;

    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(180px,1fr));

    gap:16px;
}

.game-card{
    background:var(--card);

    border-radius:16px;

    overflow:hidden;

    transition:.2s;
}

.game-card:hover{
    transform:translateY(-5px);
}

.game-cover{
    width:100%;
    aspect-ratio:1/1;

    object-fit:contain;

    padding:12px;

    background:
    linear-gradient(
        180deg,
        rgba(139,92,246,.15),
        transparent
    );
}

.game-info{
    padding:10px;
}

.game-title{
    text-align:center;

    font-size:14px;
    font-weight:bold;

    min-height:36px;

    margin-bottom:8px;
}

.play-btn{
    width:100%;

    border:none;

    padding:8px;

    border-radius:10px;

    cursor:pointer;

    color:white;
    font-weight:bold;

    background:
    linear-gradient(
        135deg,
        var(--accent),
        var(--accent2)
    );
}

/* PLAYER */

#player-container{
    display:none;
    flex-direction:column;
    gap:10px;
}

.player-bar{
    display:flex;
    gap:10px;
}

.player-btn{
    border:none;

    padding:12px 18px;

    border-radius:10px;

    cursor:pointer;

    color:white;
    font-weight:bold;

    background:
    linear-gradient(
        135deg,
        var(--accent),
        var(--accent2)
    );
}

#game-frame{
    width:100%;
    height:88vh;

    border:none;

    border-radius:12px;

    background:black;
}
</style>
</head>
<body>

<header id="header">

    <div class="logo">
        🎮 UniversalGMS
    </div>

    <div class="subtitle">
        Your Universal Gaming Hub
    </div>

    <div id="status">
        Loading games...
    </div>

    <input
        id="search"
        type="text"
        placeholder="🔍 Search games..."
    >

</header>

<div id="game-grid"></div>

<div id="player-container">

    <div class="player-bar">

        <button
            class="player-btn"
            onclick="exitGame()">
            ⬅ Exit Game
        </button>

        <button
            class="player-btn"
            onclick="fullscreenGame()">
            ⛶ Fullscreen
        </button>

    </div>

    <iframe
        id="game-frame"
        allowfullscreen>
    </iframe>

</div>

<script>

let allGames = [];

function setStatus(text){
    const status =
        document.getElementById("status");

    if(status){
        status.textContent = text;
    }
}

async function loadGames(){

    try{

        setStatus("Connecting...");

        const response =
            await fetch("/api/games");

        if(!response.ok){
            throw new Error(
                "API Error " +
                response.status
            );
        }

        const games =
            await response.json();

        allGames = games;

        setStatus(
            `${games.length} Games Available`
        );

        renderGames(games);

    }
    catch(error){

        console.error(error);

        setStatus(
            "Error: " +
            error.message
        );
    }
}

function renderGames(games){

    const grid =
        document.getElementById("game-grid");

    grid.innerHTML = "";

    games.forEach(game=>{

        const card =
            document.createElement("div");

        card.className =
            "game-card";

        card.innerHTML = `
            <img
                class="game-cover"
                src="${game.cover}"
                alt="${game.name}"
            >

            <div class="game-info">

                <div class="game-title">
                    ${game.name}
                </div>

                <button class="play-btn">
                    ▶ Play
                </button>

            </div>
        `;

        card.querySelector(".play-btn")
        .addEventListener(
            "click",
            () => playGame(game.url)
        );

        grid.appendChild(card);

    });
}

function playGame(url){

    document.getElementById("header").style.display =
        "none";

    document.getElementById("game-grid").style.display =
        "none";

    document.getElementById("player-container").style.display =
        "flex";

    document.getElementById("game-frame").src =
        url;
}

function exitGame(){

    document.getElementById("game-frame").src =
        "";

    document.getElementById("player-container").style.display =
        "none";

    document.getElementById("header").style.display =
        "block";

    document.getElementById("game-grid").style.display =
        "grid";
}

function fullscreenGame(){

    const frame =
        document.getElementById("game-frame");

    if(frame.requestFullscreen){
        frame.requestFullscreen();
    }
}

document
.getElementById("search")
.addEventListener("input", event => {

    const query =
        event.target.value.toLowerCase();

    renderGames(
        allGames.filter(game =>
            game.name
            .toLowerCase()
            .includes(query)
        )
    );
});

window.addEventListener(
    "DOMContentLoaded",
    loadGames
);

</script>

</body>
</html>
