<script>

let allGames = [];

async function loadGames(){

    try{

        document.getElementById("status")
            .textContent =
            "Connecting to API...";

        const response =
            await fetch(
                window.location.origin +
                "/api/games"
            );

        if(!response.ok){

            throw new Error(
                "API Error " +
                response.status
            );

        }

        const games =
            await response.json();

        allGames = games;

        document.getElementById("status")
            .textContent =
            games.length +
            " Games Available";

        renderGames(games);

    }
    catch(error){

        console.error(error);

        document.getElementById("status")
            .textContent =
            "Error: " +
            error.message;
    }
}

loadGames();

</script>
