<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UniversalGMS</title>

<style>
:root{
    --bg:#08080e;
    --card:#1f1f33;
    --accent:#8b5cf6;
    --accent-light:#a78bfa;
    --accent2:#6d28d9;
    --text:#ffffff;
    --muted:#9ca3af;
    --border:rgba(255,255,255,.075);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    min-height:100%;
    background:var(--bg);
    scroll-behavior:smooth;
}

body{
    min-height:100vh;

    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color:var(--text);

    background:
        radial-gradient(
            900px circle at 50% -200px,
            rgba(139,92,246,.32),
            transparent 65%
        ),
        radial-gradient(
            700px circle at 0% 45%,
            rgba(109,40,217,.08),
            transparent 70%
        ),
        #08080e;
}

/* HEADER */

header{
    position:relative;
    padding:55px 20px 30px;
    text-align:center;
}

.hero-glow{
    position:absolute;

    top:40px;
    left:50%;

    width:360px;
    height:120px;

    transform:translateX(-50%);

    border-radius:50%;

    background:rgba(139,92,246,.22);

    filter:blur(75px);

    pointer-events:none;
}

.logo-row{
    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:13px;
}

.logo-icon{
    font-size:clamp(2.3rem,8vw,3.6rem);

    filter:
        drop-shadow(
            0 0 22px
            rgba(139,92,246,.4)
        );
}

.logo{
    font-size:clamp(2.5rem,9vw,4.2rem);
    font-weight:900;

    line-height:1;

    letter-spacing:-3px;

    background:
        linear-gradient(
            135deg,
            #fff 8%,
            #ddd6fe 40%,
            #a78bfa 68%,
            #7c3aed 100%
        );

    background-clip:text;
    -webkit-background-clip:text;

    color:transparent;
    -webkit-text-fill-color:transparent;

    filter:
        drop-shadow(
            0 0 25px
            rgba(139,92,246,.15)
        );
}

.subtitle{
    margin-top:13px;

    color:var(--muted);

    font-size:.95rem;
}

/* SEARCH */

.controls{
    width:100%;
    max-width:900px;

    margin:25px auto 0;

    display:flex;
    justify-content:center;
}

.search-container{
    position:relative;

    width:100%;
    max-width:650px;
}

.search-icon{
    position:absolute;

    top:50%;
    left:17px;

    transform:translateY(-50%);

    opacity:.65;

    pointer-events:none;
}

#search{
    width:100%;

    padding:15px 47px;

    border:
        1px solid
        var(--border);

    border-radius:15px;

    outline:none;

    color:white;

    font-size:15px;

    background:
        rgba(20,20,34,.84);

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.22);

    backdrop-filter:
        blur(22px);

    transition:.2s;
}

#search::placeholder{
    color:#77778c;
}

#search:focus{
    transform:translateY(-1px);

    border-color:
        rgba(139,92,246,.7);

    box-shadow:
        0 0 0 4px
        rgba(139,92,246,.11),
        0 15px 35px
        rgba(0,0,0,.28);
}

/* LIBRARY HEADER */

.library-header{
    width:100%;
    max-width:1800px;

    margin:8px auto 18px;

    padding:0 20px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:15px;
}

.library-title-section{
    display:flex;
    align-items:center;

    gap:10px;
}

.library-icon{
    width:36px;
    height:36px;

    display:grid;
    place-items:center;

    border:
        1px solid
        rgba(139,92,246,.2);

    border-radius:11px;

    background:
        rgba(139,92,246,.09);
}

.library-title{
    font-size:18px;
    font-weight:800;
}

.library-description{
    margin-top:2px;

    color:var(--muted);

    font-size:12px;
}

#status{
    min-height:35px;

    display:inline-flex;
    align-items:center;

    padding:7px 12px;

    border:
        1px solid
        rgba(139,92,246,.18);

    border-radius:999px;

    color:#c4b5fd;

    font-size:12px;
    font-weight:700;

    background:
        rgba(139,92,246,.08);

    white-space:nowrap;
}

/* LOADING */

.loading-ring{
    width:14px;
    height:14px;

    margin-right:7px;

    display:inline-block;

    border:
        2px solid
        rgba(196,181,253,.23);

    border-top-color:#c4b5fd;

    border-radius:50%;

    animation:
        spin .8s linear infinite;
}

/* GRID */

#game-grid{
    width:100%;
    max-width:1800px;

    margin:auto;

    padding:0 20px 55px;

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(190px,1fr)
        );

    gap:18px;
}

/* CARD */

.game-card{
    position:relative;

    min-width:0;

    display:flex;
    flex-direction:column;

    overflow:hidden;

    border:
        1px solid
        var(--border);

    border-radius:19px;

    background:
        linear-gradient(
            145deg,
            rgba(31,31,51,.94),
            rgba(17,17,29,.94)
        );

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.18);

    animation:
        cardAppear .45s ease both;

    transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;
}

.game-card:hover{
    transform:
        translateY(-7px)
        scale(1.012);

    border-color:
        rgba(139,92,246,.42);

    box-shadow:
        0 22px 48px
        rgba(0,0,0,.36),
        0 0 30px
        rgba(139,92,246,.07);
}

/* COVER */

.cover-container{
    position:relative;

    width:100%;

    aspect-ratio:1/1;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:
        radial-gradient(
            circle at center,
            rgba(139,92,246,.15),
            rgba(11,11,19,.42)
        );
}

.game-cover{
    width:100%;
    height:100%;

    padding:15px;

    object-fit:contain;

    transition:
        transform .3s ease,
        filter .3s ease;
}

.game-card:hover .game-cover{
    transform:scale(1.055);
    filter:brightness(1.08);
}

.cover-fallback{
    width:100%;
    height:100%;

    display:none;
    align-items:center;
    justify-content:center;

    color:#c4b5fd;

    font-size:3rem;
}

.cover-overlay{
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            transparent 56%,
            rgba(8,8,14,.54)
        );

    pointer-events:none;
}

/* GAME INFO */

.game-info{
    position:relative;

    flex:1;

    display:flex;
    flex-direction:column;

    padding:13px 13px 14px;
}

.game-title{
    width:100%;

    margin-bottom:11px;

    overflow:hidden;

    color:#f5f3ff;

    text-align:center;

    font-size:14px;
    font-weight:750;

    white-space:nowrap;
    text-overflow:ellipsis;
}

.play-btn{
    width:100%;

    margin-top:auto;

    padding:10px 14px;

    border:none;
    border-radius:11px;

    cursor:pointer;

    color:white;

    font-size:13px;
    font-weight:750;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );

    box-shadow:
        0 8px 22px
        rgba(109,40,217,.2);

    transition:.2s;
}

.play-btn:hover{
    transform:translateY(-2px);

    filter:brightness(1.1);

    box-shadow:
        0 12px 35px
        rgba(139,92,246,.28);
}

.play-btn:active{
    transform:
        scale(.98);
}

/* EMPTY / ERROR */

.empty-message{
    grid-column:1/-1;

    min-height:330px;

    padding:70px 20px;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    text-align:center;

    color:var(--muted);
}

.empty-icon{
    margin-bottom:15px;

    font-size:48px;
}

.empty-title{
    margin-bottom:7px;

    color:white;

    font-size:21px;
    font-weight:800;
}

.empty-description{
    max-width:500px;

    font-size:14px;
    line-height:1.6;
}

/* PLAYER */

#player-container{
    position:fixed;

    inset:0;

    z-index:500;

    display:none;
    flex-direction:column;

    width:100%;
    height:100%;

    background:#060609;
}

.player-bar{
    min-height:66px;

    padding:10px 14px;

    display:flex;
    align-items:center;

    gap:10px;

    border-bottom:
        1px solid
        rgba(255,255,255,.07);

    background:
        rgba(14,14,24,.97);

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.2);

    backdrop-filter:
        blur(22px);
}

.player-brand{
    margin-right:auto;

    display:flex;
    align-items:center;

    gap:9px;

    font-size:15px;
    font-weight:850;
}

.player-brand-name{
    color:var(--accent-light);
}

.player-game-name{
    max-width:340px;

    overflow:hidden;

    color:var(--muted);

    font-size:12px;

    white-space:nowrap;
    text-overflow:ellipsis;
}

.player-btn{
    padding:10px 15px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:10px;

    cursor:pointer;

    color:white;

    font-size:13px;
    font-weight:750;

    background:
        rgba(255,255,255,.055);

    transition:.2s;
}

.player-btn:hover{
    transform:translateY(-1px);

    border-color:
        rgba(139,92,246,.42);

    background:
        rgba(139,92,246,.15);
}

#game-frame{
    flex:1;

    width:100%;
    height:100%;

    border:none;

    background:black;
}

/* ANIMATIONS */

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@keyframes cardAppear{
    from{
        opacity:0;
        transform:translateY(13px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* SCROLLBAR */

::-webkit-scrollbar{
    width:9px;
}

::-webkit-scrollbar-track{
    background:var(--bg);
}

::-webkit-scrollbar-thumb{
    border-radius:999px;
    background:#292940;
}

::-webkit-scrollbar-thumb:hover{
    background:#3a3a59;
}

/* MOBILE */

@media(max-width:760px){

    .library-header{
        align-items:flex-start;
        flex-direction:column;
    }

    .player-game-name{
        display:none;
    }
}

@media(max-width:600px){

    header{
        padding:38px 14px 25px;
    }

    .logo-row{
        gap:8px;
    }

    .logo{
        font-size:2.45rem;
        letter-spacing:-2px;
    }

    .logo-icon{
        font-size:2.25rem;
    }

    .library-header{
        padding:0 12px;
    }

    #game-grid{
        padding:0 12px 35px;

        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap:11px;
    }

    .game-cover{
        padding:10px;
    }

    .game-info{
        padding:10px;
    }

    .game-title{
        font-size:12px;
    }

    .play-btn{
        padding:9px;
        font-size:12px;
    }

    .player-brand{
        display:none;
    }

    .player-btn{
        flex:1;
    }
}

</style>
</head>

<body>

<header id="header">

    <div class="hero-glow"></div>

    <div class="logo-row">

        <span class="logo-icon">
            🎮
        </span>

        <div class="logo">
            UniversalGMS
        </div>

    </div>

    <div class="subtitle">
    
    </div>

    <div class="controls">

        <div class="search-container">

            <span class="search-icon">
                🔍
            </span>

            <input
                id="search"
                type="search"
                placeholder="Search library..."
                autocomplete="off"
            >

        </div>

    </div>

</header>


<section
    class="library-header"
    id="library-header"
>

    <div class="library-title-section">

        <div class="library-icon">
            📖 
        </div>

        <div>

            <div class="library-title">
                Game Library
            </div>

            <div class="library-description">
                
            </div>

        </div>

    </div>

    <div id="status">

        <span class="loading-ring"></span>

        Loading games...

    </div>

</section>


<main id="game-grid"></main>


<section id="player-container">

    <div class="player-bar">

        <div class="player-brand">

            🎮

            <span class="player-brand-name">
                UniversalGMS
            </span>

            <span
                class="player-game-name"
                id="player-game-name"
            ></span>

        </div>

        <button
            class="player-btn"
            id="exit-button"
            type="button"
        >
            ← Exit Game
        </button>

        <button
            class="player-btn"
            id="fullscreen-button"
            type="button"
        >
            ⛶ Fullscreen
        </button>

    </div>

    <iframe
        id="game-frame"
        title="UniversalGMS Game Player"
        allow="fullscreen; autoplay; gamepad"
        allowfullscreen
    ></iframe>

</section>


<script>

let allGames = [];


/* STATUS */

function setStatus(text, loading = false){

    const status =
        document.getElementById("status");

    if(!status){
        return;
    }

    if(loading){

        status.innerHTML =
            '<span class="loading-ring"></span>' +
            escapeHTML(text);

    }
    else{

        status.textContent =
            text;

    }
}


/* LOAD NORMAL HUB */

async function loadGames(){

    try{

        setStatus(
            "Loading games...",
            true
        );

        const response =
            await fetch("/api/games");

        if(!response.ok){

            throw new Error(
                `API Error ${response.status}`
            );

        }

        const games =
            await response.json();

        allGames =
            Array.isArray(games)
                ? games
                : [];

        allGames.sort(
            (a,b) =>
                a.name.localeCompare(b.name)
        );

        updateGameCount(
            allGames.length,
            false
        );

        renderGames(allGames);

    }
    catch(error){

        console.error(
            "UniversalGMS loading error:",
            error
        );

        setStatus(
            "Unable to load games"
        );

        renderError(
            error.message
        );

    }
}


/* COUNT */

function updateGameCount(amount, searching){

    if(searching){

        setStatus(
            `${amount} ${
                amount === 1
                    ? "Result"
                    : "Results"
            }`
        );

        return;

    }

    setStatus(
        `${amount} ${
            amount === 1
                ? "Game"
                : "Games"
        } Available`
    );

}


/* GAME CARD */

function createGameCard(game,index){

    const card =
        document.createElement("article");

    card.className =
        "game-card";

    card.style.animationDelay =
        `${Math.min(index * 25,250)}ms`;


    const coverContainer =
        document.createElement("div");

    coverContainer.className =
        "cover-container";


    const fallback =
        document.createElement("div");

    fallback.className =
        "cover-fallback";

    fallback.textContent =
        "🎮";


    if(game.cover){

        const image =
            document.createElement("img");

        image.className =
            "game-cover";

        image.src =
            game.cover;

        image.alt =
            `${game.name} cover`;

        image.loading =
            "lazy";

        image.addEventListener(
            "error",
            function(){

                image.remove();

                fallback.style.display =
                    "flex";

            }
        );

        coverContainer.appendChild(
            image
        );

    }
    else{

        fallback.style.display =
            "flex";

    }


    coverContainer.appendChild(
        fallback
    );


    const overlay =
        document.createElement("div");

    overlay.className =
        "cover-overlay";

    coverContainer.appendChild(
        overlay
    );


    const gameInfo =
        document.createElement("div");

    gameInfo.className =
        "game-info";


    const title =
        document.createElement("div");

    title.className =
        "game-title";

    title.textContent =
        game.name;

    title.title =
        game.name;


    const play =
        document.createElement("button");

    play.className =
        "play-btn";

    play.type =
        "button";

    play.textContent =
        "▶ Play Game";

    play.addEventListener(
        "click",
        function(){

            playGame(game);

        }
    );


    gameInfo.appendChild(title);
    gameInfo.appendChild(play);

    card.appendChild(
        coverContainer
    );

    card.appendChild(
        gameInfo
    );

    return card;
}


/* RENDER */

function renderGames(games){

    const grid =
        document.getElementById(
            "game-grid"
        );

    grid.replaceChildren();


    if(games.length === 0){

        grid.innerHTML = `
            <div class="empty-message">

                <div class="empty-icon">
                    🎮
                </div>

                <div class="empty-title">
                    No games found
                </div>

                <div class="empty-description">
                    Try searching for another game.
                </div>

            </div>
        `;

        return;
    }


    const fragment =
        document.createDocumentFragment();


    games.forEach(
        (game,index) => {

            fragment.appendChild(
                createGameCard(
                    game,
                    index
                )
            );

        }
    );


    grid.appendChild(fragment);
}


/* ERROR */

function renderError(message){

    const grid =
        document.getElementById(
            "game-grid"
        );

    grid.innerHTML = `
        <div class="empty-message">

            <div class="empty-icon">
                ⚠️
            </div>

            <div class="empty-title">
                Couldn't load the library
            </div>

            <div class="empty-description">
                ${escapeHTML(message)}
            </div>

        </div>
    `;
}


/* PLAYER */

function playGame(game){

    if(!game || !game.url){
        return;
    }

    document
        .getElementById("header")
        .style.display =
        "none";

    document
        .getElementById("library-header")
        .style.display =
        "none";

    document
        .getElementById("game-grid")
        .style.display =
        "none";

    document
        .getElementById("player-container")
        .style.display =
        "flex";


    document
        .getElementById("player-game-name")
        .textContent =
        `• ${game.name}`;


    document
        .getElementById("game-frame")
        .src =
        game.url;


    document.body.style.overflow =
        "hidden";
}


function exitGame(){

    document
        .getElementById("game-frame")
        .src =
        "about:blank";


    document
        .getElementById("player-container")
        .style.display =
        "none";


    document
        .getElementById("header")
        .style.display =
        "block";


    document
        .getElementById("library-header")
        .style.display =
        "flex";


    document
        .getElementById("game-grid")
        .style.display =
        "grid";


    document.body.style.overflow =
        "";

    window.scrollTo(0,0);
}


/* FULLSCREEN */

async function fullscreenGame(){

    const frame =
        document.getElementById(
            "game-frame"
        );

    try{

        if(document.fullscreenElement){

            await document.exitFullscreen();

            return;
        }

        if(frame.requestFullscreen){

            await frame.requestFullscreen();

        }
        else if(
            frame.webkitRequestFullscreen
        ){

            frame.webkitRequestFullscreen();

        }

    }
    catch(error){

        console.error(
            "Fullscreen failed:",
            error
        );

    }
}


/* SEARCH */

document
    .getElementById("search")
    .addEventListener(
        "input",
        function(event){

            const query =
                event.target.value
                    .trim()
                    .toLowerCase();


            const filtered =
                allGames.filter(
                    game =>
                        game.name
                            .toLowerCase()
                            .includes(query)
                );


            renderGames(filtered);


            updateGameCount(
                filtered.length,
                Boolean(query)
            );

        }
    );


/* BUTTONS */

document
    .getElementById("exit-button")
    .addEventListener(
        "click",
        exitGame
    );


document
    .getElementById("fullscreen-button")
    .addEventListener(
        "click",
        fullscreenGame
    );


/* ESCAPE */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape" &&
            !document.fullscreenElement
        ){

            const player =
                document.getElementById(
                    "player-container"
                );

            if(
                player.style.display ===
                "flex"
            ){

                exitGame();

            }

        }

    }
);


/* SAFE HTML */

function escapeHTML(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );
}


window.addEventListener(
    "DOMContentLoaded",
    loadGames
);

</script>

</body>
</html>
