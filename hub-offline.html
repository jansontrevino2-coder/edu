<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UniversalGMS Offline</title>

<style>
:root{
    --bg:#0f0f1a;
    --card:#1f1f33;
    --accent:#8b5cf6;
    --accent2:#6d28d9;
    --text:#ffffff;
    --muted:#a1a1aa;
    --border:rgba(255,255,255,.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    background:var(--bg);
}

body{
    min-height:100vh;
    padding:20px;
    font-family:Arial,sans-serif;
    color:var(--text);

    background:
        radial-gradient(
            circle at top,
            rgba(139,92,246,.25),
            transparent 40%
        ),
        var(--bg);
}

/* HEADER */

header{
    text-align:center;
    margin-bottom:25px;
}

.logo-icon{
    display:block;
    margin-bottom:8px;
    font-size:4rem;
}

.logo{
    margin-bottom:10px;
    font-size:clamp(2.5rem,9vw,4rem);
    font-weight:900;
    line-height:1;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #c4b5fd,
            #8b5cf6
        );

    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
}

.subtitle{
    margin-bottom:15px;
    color:var(--muted);
    font-size:1rem;
}

#status{
    margin-bottom:18px;
    color:var(--muted);
}

#search{
    width:100%;
    max-width:700px;
    padding:14px 16px;

    border:1px solid var(--border);
    border-radius:14px;
    outline:none;

    background:#1b1b2f;
    color:white;

    font-size:15px;
}

#search:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(139,92,246,.18);
}

#search::placeholder{
    color:#9696a5;
}

/* GAME GRID */

#game-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(170px,1fr));

    gap:16px;
    width:100%;
    max-width:1900px;
    margin:auto;
}

.game-card{
    display:flex;
    flex-direction:column;
    overflow:hidden;

    min-width:0;

    border:1px solid var(--border);
    border-radius:16px;

    background:var(--card);

    transition:
        transform .2s,
        border-color .2s,
        box-shadow .2s;
}

.game-card:hover{
    transform:translateY(-5px);
    border-color:rgba(139,92,246,.5);
    box-shadow:0 12px 30px rgba(0,0,0,.25);
}

.cover-container{
    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    width:100%;
    aspect-ratio:1 / 1;

    overflow:hidden;

    background:
        linear-gradient(
            180deg,
            rgba(139,92,246,.16),
            rgba(15,15,26,.2)
        );
}

.game-cover{
    display:block;

    width:100%;
    height:100%;

    padding:10px;

    object-fit:contain;
}

.cover-fallback{
    display:none;
    align-items:center;
    justify-content:center;

    width:100%;
    height:100%;

    color:#c4b5fd;
    font-size:3rem;

    background:
        linear-gradient(
            180deg,
            rgba(139,92,246,.16),
            rgba(15,15,26,.2)
        );
}

.game-info{
    display:flex;
    flex:1;
    flex-direction:column;

    padding:10px;
}

.game-title{
    display:flex;
    align-items:center;
    justify-content:center;

    min-height:38px;
    margin-bottom:9px;

    overflow-wrap:anywhere;

    text-align:center;
    font-size:14px;
    font-weight:bold;
}

.play-btn{
    width:100%;
    margin-top:auto;
    padding:9px;

    border:none;
    border-radius:10px;

    cursor:pointer;

    color:white;
    font-size:13px;
    font-weight:bold;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );
}

.play-btn:hover{
    filter:brightness(1.1);
}

.empty-message{
    grid-column:1 / -1;

    padding:40px;

    color:var(--muted);
    text-align:center;
}

/* PLAYER */

#player-container{
    display:none;
    flex-direction:column;

    gap:10px;
    width:100%;
    max-width:1800px;
    margin:auto;
}

.player-bar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.player-btn{
    padding:12px 18px;

    border:none;
    border-radius:10px;

    cursor:pointer;

    color:white;
    font-weight:bold;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );
}

.player-btn:hover{
    filter:brightness(1.1);
}

#game-frame{
    width:100%;
    height:88vh;

    border:none;
    border-radius:12px;

    background:black;

    box-shadow:
        0 0 35px rgba(139,92,246,.2);
}

@media(max-width:600px){
    body{
        padding:14px;
    }

    #game-grid{
        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap:12px;
    }

    .game-info{
        padding:9px;
    }

    .game-title{
        font-size:13px;
    }

    #game-frame{
        height:82vh;
    }

    .player-btn{
        flex:1;
        padding:11px;
    }
}
</style>
</head>

<body>

<header id="header">

    <span class="logo-icon">🎮</span>

    <div class="logo">
        UniversalGMS
    </div>

    <div class="subtitle">
        GitLab Powered Hub
    </div>

    <div id="status">
        Scanning GitLab...
    </div>

    <input
        id="search"
        type="search"
        placeholder="🔍 Search games..."
        autocomplete="off"
    >

</header>

<main id="game-grid"></main>

<section id="player-container">

    <div class="player-bar">

        <button
            class="player-btn"
            id="exit-button"
            type="button">
            ⬅ Exit Game
        </button>

        <button
            class="player-btn"
            id="fullscreen-button"
            type="button">
            ⛶ Fullscreen
        </button>

    </div>

    <iframe
        id="game-frame"
        title="UniversalGMS Game Player"
        allow="fullscreen; autoplay; gamepad"
        allowfullscreen>
    </iframe>

</section>

<script>
const GITLAB_PROJECT_ID = "86390728";
const GITLAB_BRANCH = "main";
const GITLAB_FOLDER = "Games";

const VERCEL_BASE_URL =
    "https://universaledu.vercel.app";

let allGames = [];


function setStatus(text){

    const status =
        document.getElementById("status");

    if(status){
        status.textContent = text;
    }

}


function makeHostedUrl(filePath){

    const encodedPath =
        filePath
            .split("/")
            .map(part => encodeURIComponent(part))
            .join("/");

    return `${VERCEL_BASE_URL}/${encodedPath}`;

}


async function fetchRepositoryPage(page){

    const parameters =
        new URLSearchParams({
            path:GITLAB_FOLDER,
            ref:GITLAB_BRANCH,
            recursive:"true",
            per_page:"100",
            page:String(page)
        });

    const apiUrl =
        `https://gitlab.com/api/v4/projects/${GITLAB_PROJECT_ID}/repository/tree?${parameters.toString()}`;

    const response =
        await fetch(apiUrl);

    if(!response.ok){

        throw new Error(
            `GitLab API error ${response.status}`
        );

    }

    const files =
        await response.json();

    return {
        files,
        nextPage:
            response.headers.get("x-next-page")
    };

}


async function fetchAllRepositoryFiles(){

    const collectedFiles = [];

    let page = 1;

    while(true){

        const result =
            await fetchRepositoryPage(page);

        collectedFiles.push(
            ...result.files
        );

        if(!result.nextPage){
            break;
        }

        page =
            Number(result.nextPage);

    }

    return collectedFiles;

}


async function loadGames(){

    try{

        setStatus(
            "Scanning GitLab games..."
        );

        const files =
            await fetchAllRepositoryFiles();

        const games = {};

        files.forEach(file => {

            if(file.type !== "blob"){
                return;
            }

            const parts =
                file.path.split("/");

            if(parts.length < 3){
                return;
            }

            const folderName =
                parts[1];

            const fileName =
                parts[parts.length - 1];

            const lowerFileName =
                fileName.toLowerCase();

            if(!games[folderName]){

                games[folderName] = {
                    name:folderName,
                    url:null,
                    cover:null
                };

            }

            const hostedUrl =
                makeHostedUrl(file.path);

            if(
                lowerFileName.endsWith(".html")
            ){

                const expectedName =
                    `${folderName}.html`
                    .toLowerCase();

                if(
                    !games[folderName].url ||
                    lowerFileName === "index.html" ||
                    lowerFileName === expectedName
                ){

                    games[folderName].url =
                        hostedUrl;

                }

            }

            if(
                /\.(png|jpg|jpeg|webp|gif)$/i
                .test(fileName)
            ){

                const isNamedCover =
                    /^cover\.(png|jpg|jpeg|webp|gif)$/i
                    .test(fileName);

                if(
                    isNamedCover ||
                    !games[folderName].cover
                ){

                    games[folderName].cover =
                        hostedUrl;

                }

            }

        });

        allGames =
            Object.values(games)
                .filter(game => game.url)
                .sort(
                    (first,second) =>
                        first.name.localeCompare(
                            second.name
                        )
                );

        setStatus(
            `${allGames.length} Games Available`
        );

        renderGames(allGames);

    }
    catch(error){

        console.error(
            "UniversalGMS loading error:",
            error
        );

        setStatus(
            `Failed to load games: ${error.message}`
        );

    }

}


function createGameCard(game){

    const card =
        document.createElement("article");

    card.className =
        "game-card";


    const coverContainer =
        document.createElement("div");

    coverContainer.className =
        "cover-container";


    const fallback =
        document.createElement("div");

    fallback.className =
        "cover-fallback";

    fallback.textContent =
        "🎮";


    if(game.cover){

        const image =
            document.createElement("img");

        image.className =
            "game-cover";

        image.src =
            game.cover;

        image.alt =
            `${game.name} cover`;

        image.loading =
            "lazy";

        image.addEventListener(
            "error",
            function(){

                image.remove();

                fallback.style.display =
                    "flex";

            }
        );

        coverContainer.appendChild(
            image
        );

    }
    else{

        fallback.style.display =
            "flex";

    }

    coverContainer.appendChild(
        fallback
    );


    const gameInfo =
        document.createElement("div");

    gameInfo.className =
        "game-info";


    const gameTitle =
        document.createElement("div");

    gameTitle.className =
        "game-title";

    gameTitle.textContent =
        game.name;


    const playButton =
        document.createElement("button");

    playButton.className =
        "play-btn";

    playButton.type =
        "button";

    playButton.textContent =
        "▶ Play";

    playButton.addEventListener(
        "click",
        function(){

            playGame(game.url);

        }
    );


    gameInfo.appendChild(
        gameTitle
    );

    gameInfo.appendChild(
        playButton
    );

    card.appendChild(
        coverContainer
    );

    card.appendChild(
        gameInfo
    );

    return card;

}


function renderGames(games){

    const grid =
        document.getElementById("game-grid");

    grid.replaceChildren();

    if(games.length === 0){

        const emptyMessage =
            document.createElement("div");

        emptyMessage.className =
            "empty-message";

        emptyMessage.textContent =
            "No games found.";

        grid.appendChild(
            emptyMessage
        );

        return;

    }

    const fragment =
        document.createDocumentFragment();

    games.forEach(game => {

        fragment.appendChild(
            createGameCard(game)
        );

    });

    grid.appendChild(
        fragment
    );

}


function playGame(url){

    const header =
        document.getElementById("header");

    const grid =
        document.getElementById("game-grid");

    const player =
        document.getElementById("player-container");

    const frame =
        document.getElementById("game-frame");

    header.style.display =
        "none";

    grid.style.display =
        "none";

    player.style.display =
        "flex";

    frame.src =
        url;

    window.scrollTo({
        top:0,
        behavior:"auto"
    });

}


function exitGame(){

    const header =
        document.getElementById("header");

    const grid =
        document.getElementById("game-grid");

    const player =
        document.getElementById("player-container");

    const frame =
        document.getElementById("game-frame");

    frame.src =
        "about:blank";

    player.style.display =
        "none";

    header.style.display =
        "block";

    grid.style.display =
        "grid";

    window.scrollTo({
        top:0,
        behavior:"auto"
    });

}


async function fullscreenGame(){

    const frame =
        document.getElementById("game-frame");

    try{

        if(frame.requestFullscreen){

            await frame.requestFullscreen();

        }
        else if(frame.webkitRequestFullscreen){

            frame.webkitRequestFullscreen();

        }

    }
    catch(error){

        console.error(
            "Fullscreen failed:",
            error
        );

    }

}


document
    .getElementById("exit-button")
    .addEventListener(
        "click",
        exitGame
    );


document
    .getElementById("fullscreen-button")
    .addEventListener(
        "click",
        fullscreenGame
    );


document
    .getElementById("search")
    .addEventListener(
        "input",
        function(event){

            const query =
                event.target.value
                    .trim()
                    .toLowerCase();

            const filteredGames =
                allGames.filter(
                    game =>
                        game.name
                            .toLowerCase()
                            .includes(query)
                );

            renderGames(
                filteredGames
            );

        }
    );


window.addEventListener(
    "DOMContentLoaded",
    loadGames
);
</script>

</body>
</html>
