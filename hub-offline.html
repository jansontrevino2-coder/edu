<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniversalGMS Offline</title>

<style>
:root{
    --bg:#0f0f1a;
    --card:#1f1f33;
    --accent:#8b5cf6;
    --accent2:#6d28d9;
    --text:#ffffff;
    --muted:#a1a1aa;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    padding:20px;
    font-family:Arial,sans-serif;

    background:
    radial-gradient(
        circle at top,
        rgba(139,92,246,.25),
        transparent 40%
    ),
    var(--bg);

    color:var(--text);
}

header{
    text-align:center;
    margin-bottom:25px;
}

.logo{
    font-size:3.5rem;
    font-weight:900;

    background:
    linear-gradient(
        135deg,
        #fff,
        #c4b5fd,
        #8b5cf6
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    margin-bottom:10px;
}

.subtitle{
    color:var(--muted);
    margin-bottom:15px;
}

#status{
    color:var(--muted);
    margin-bottom:15px;
}

#search{
    width:100%;
    max-width:700px;

    padding:14px;

    border:none;
    outline:none;

    border-radius:12px;

    background:#1b1b2f;
    color:white;
}

#game-grid{
    max-width:1900px;
    margin:auto;

    display:grid;

    grid-template-columns:
    repeat(auto-fill,minmax(180px,1fr));

    gap:16px;
}

.game-card{
    background:var(--card);
    border-radius:16px;
    overflow:hidden;
    transition:.2s;
}

.game-card:hover{
    transform:translateY(-5px);
}

.game-cover{
    width:100%;
    aspect-ratio:1/1;

    object-fit:contain;

    padding:12px;

    background:
    linear-gradient(
        180deg,
        rgba(139,92,246,.15),
        transparent
    );
}

.game-info{
    padding:10px;
}

.game-title{
    text-align:center;

    font-size:14px;
    font-weight:bold;

    min-height:36px;

    margin-bottom:8px;
}

.play-btn{
    width:100%;

    border:none;

    padding:8px;

    border-radius:10px;

    cursor:pointer;

    color:white;

    font-weight:bold;

    background:
    linear-gradient(
        135deg,
        var(--accent),
        var(--accent2)
    );
}

#player-container{
    display:none;
    flex-direction:column;
    gap:10px;
}

.player-bar{
    display:flex;
    gap:10px;
}

.player-btn{
    border:none;

    padding:12px 18px;

    border-radius:10px;

    cursor:pointer;

    color:white;

    font-weight:bold;

    background:
    linear-gradient(
        135deg,
        var(--accent),
        var(--accent2)
    );
}

#game-frame{
    width:100%;
    height:88vh;

    border:none;

    border-radius:12px;

    background:black;
}
</style>
</head>
<body>

<header id="header">

    <div class="logo">
        🎮 UniversalGMS
    </div>

    <div class="subtitle">
        GitLab Powered Hub
    </div>

    <div id="status">
        Scanning GitLab...
    </div>

    <input
        id="search"
        type="text"
        placeholder="🔍 Search games..."
    >

</header>

<div id="game-grid"></div>

<div id="player-container">

    <div class="player-bar">

        <button
            class="player-btn"
            onclick="exitGame()">
            ⬅ Exit Game
        </button>

        <button
            class="player-btn"
            onclick="fullscreenGame()">
            ⛶ Fullscreen
        </button>

    </div>

    <iframe
        id="game-frame"
        allowfullscreen>
    </iframe>

</div>

<script>

const GITLAB_PROJECT_ID = "86390728";

let allGames = [];

function setStatus(text){

    const status =
        document.getElementById("status");

    if(status){
        status.textContent = text;
    }

}
async function loadGames(){

    try{

        setStatus(
            "Scanning GitLab Games..."
        );

        const response =
            await fetch(
                "https://gitlab.com/api/v4/projects/86390728/repository/tree?path=Games&recursive=true&per_page=1000"
            );

        if(!response.ok){

            throw new Error(
                "GitLab API Error " +
                response.status
            );

        }

        const files =
            await response.json();

        const games = {};

        files.forEach(file => {

            if(file.type !== "blob")
                return;

            const parts =
                file.path.split("/");

            if(parts.length < 3)
                return;

            const folder =
                parts[1];

            const fileName =
                parts[parts.length - 1];

            if(!games[folder]){

                games[folder] = {
                    name: folder,
                    url: null,
                    cover: null
                };

            }

            const vercelUrl =
                `https://universaledu.vercel.app/${file.path}`;

            if(
                fileName
                .toLowerCase()
                .endsWith(".html")
            ){

                games[folder].url =
                    vercelUrl;

            }

            if(
                /\.(png|jpg|jpeg|webp|gif)$/i
                .test(fileName)
            ){

                games[folder].cover =
                    vercelUrl;

            }

        });

        allGames =
            Object.values(games)
            .filter(game => game.url);

        allGames.sort((a,b)=>
            a.name.localeCompare(b.name)
        );

        setStatus(
            `${allGames.length} Games Available`
        );

        renderGames(allGames);

    }
    catch(error){

        console.error(error);

        setStatus(
            "Failed to connect to GitLab"
        );

    }

}

function renderGames(games){

    const grid =
        document.getElementById("game-grid");

    grid.innerHTML = "";

    games.forEach(game => {

        const card =
            document.createElement("div");

        card.className =
            "game-card";

        const cover =
            game.cover ||
            "https://via.placeholder.com/300?text=No+Cover";

    card.innerHTML = `
    ${cover}

    <div class="game-info">

        <div class="game-title">
            ${game.name}
        </div>

        <button class="play-btn">
            ▶ Play
        </button>

    </div>
`;



        card
        .querySelector(".play-btn")
        .addEventListener(
            "click",
            () => playGame(game.url)
        );

        grid.appendChild(card);

    });

}
function playGame(url){

    document
        .getElementById("header")
        .style.display = "none";

    document
        .getElementById("game-grid")
        .style.display = "none";

    document
        .getElementById("player-container")
        .style.display = "flex";

    document
        .getElementById("game-frame")
        .src =
        url;

}

function exitGame(){

    document
        .getElementById("game-frame")
        .src = "";

    document
        .getElementById("player-container")
        .style.display = "none";

    document
        .getElementById("header")
        .style.display = "block";

    document
        .getElementById("game-grid")
        .style.display = "grid";

}

function fullscreenGame(){

    const frame =
        document.getElementById("game-frame");

    if(frame.requestFullscreen){

        frame.requestFullscreen();

    }
    else if(frame.webkitRequestFullscreen){

        frame.webkitRequestFullscreen();

    }

}

document
.getElementById("search")
.addEventListener(
    "input",
    event => {

        const query =
            event.target.value
            .toLowerCase();

        renderGames(

            allGames.filter(
                game =>
                    game.name
                    .toLowerCase()
                    .includes(query)
            )

        );

    }
);

window.addEventListener(
    "DOMContentLoaded",
    loadGames
);

</script>

</body>
</html>
