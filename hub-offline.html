<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UniversalGMS</title>

<style>
:root {
    --bg: #0b0b10;
    --surface: #15151d;
    --surface-hover: #1b1b26;
    --accent: #8b5cf6;
    --accent-hover: #7c3aed;
    --text: #f5f5f7;
    --muted: #8d8d9b;
    --border: #272733;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    min-height: 100%;
    background: var(--bg);
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;

    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color: var(--text);
    background: var(--bg);
}

/* HEADER */

header {
    width: 100%;
    max-width: 1400px;

    margin: 0 auto;
    padding: 46px 20px 28px;

    text-align: center;
}

.logo-row {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: 10px;
}

.logo-icon {
    font-size: 2rem;
}

.logo {
    color: white;

    font-size: clamp(2rem, 7vw, 3rem);
    font-weight: 800;

    letter-spacing: -2px;
}

.subtitle {
    margin-top: 8px;

    color: var(--muted);

    font-size: 14px;
}

/* SEARCH */

.controls {
    display: flex;
    justify-content: center;

    margin-top: 28px;
}

.search-container {
    position: relative;

    width: 100%;
    max-width: 580px;
}

.search-icon {
    position: absolute;

    top: 50%;
    left: 15px;

    transform: translateY(-50%);

    opacity: .5;

    pointer-events: none;
}

#search {
    width: 100%;
    height: 48px;

    padding: 0 46px;

    border: 1px solid var(--border);
    border-radius: 12px;

    outline: none;

    color: white;

    font-size: 14px;

    background: var(--surface);

    transition:
        border-color .15s ease,
        background .15s ease;
}

#search::placeholder {
    color: #696977;
}

#search:hover {
    background: #181820;
}

#search:focus {
    border-color: var(--accent);
}

/* LIBRARY HEADER */

.library-header {
    width: 100%;
    max-width: 1400px;

    margin: 0 auto 18px;
    padding: 0 20px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 15px;
}

.library-title-section {
    display: flex;
    align-items: center;

    gap: 11px;
}

.library-icon {
    width: 38px;
    height: 38px;

    display: grid;
    place-items: center;

    border-radius: 10px;

    background: #1c1728;
}

.library-title {
    font-size: 17px;
    font-weight: 700;
}

/* STATUS */

#status {
    min-height: 32px;

    display: inline-flex;
    align-items: center;

    padding: 6px 11px;

    border: 1px solid var(--border);
    border-radius: 8px;

    color: var(--muted);

    font-size: 12px;

    background: var(--surface);

    white-space: nowrap;
}

.loading-ring {
    width: 13px;
    height: 13px;

    margin-right: 7px;

    display: inline-block;

    border: 2px solid #343442;
    border-top-color: var(--accent);

    border-radius: 50%;

    animation: spin .8s linear infinite;
}

/* GRID */

#game-grid {
    width: 100%;
    max-width: 1400px;

    margin: 0 auto;

    padding: 0 20px 50px;

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(180px, 1fr)
        );

    gap: 14px;
}

/* GAME CARDS */

.game-card {
    min-width: 0;

    display: flex;
    flex-direction: column;

    overflow: hidden;

    border: 1px solid var(--border);
    border-radius: 13px;

    background: var(--surface);

    transition:
        background .15s ease,
        border-color .15s ease,
        transform .15s ease;
}

.game-card:hover {
    transform: translateY(-3px);

    border-color: #3b3550;

    background: var(--surface-hover);
}

/* COVER */

.cover-container {
    position: relative;

    width: 100%;

    aspect-ratio: 1 / 1;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    background: #101016;
}

.game-cover {
    width: 100%;
    height: 100%;

    padding: 12px;

    object-fit: contain;

    transition: transform .2s ease;
}

.game-card:hover .game-cover {
    transform: scale(1.025);
}

.cover-fallback {
    width: 100%;
    height: 100%;

    display: none;
    align-items: center;
    justify-content: center;

    color: var(--accent);

    font-size: 2.7rem;
}

/* GAME INFO */

.game-info {
    flex: 1;

    display: flex;
    flex-direction: column;

    padding: 11px;
}

.game-title {
    width: 100%;

    margin-bottom: 10px;

    overflow: hidden;

    color: var(--text);

    font-size: 13px;
    font-weight: 600;

    white-space: nowrap;
    text-overflow: ellipsis;
}

/* PLAY BUTTON */

.play-btn {
    width: 100%;

    margin-top: auto;
    padding: 9px 12px;

    border: 0;
    border-radius: 8px;

    cursor: pointer;

    color: white;

    font-size: 12px;
    font-weight: 650;

    background: var(--accent);

    transition:
        background .15s ease,
        transform .15s ease;
}

.play-btn:hover {
    background: var(--accent-hover);
}

.play-btn:active {
    transform: scale(.98);
}

/* EMPTY / ERROR */

.empty-message {
    grid-column: 1 / -1;

    min-height: 300px;

    padding: 50px 20px;

    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;

    text-align: center;

    color: var(--muted);
}

.empty-icon {
    margin-bottom: 12px;

    font-size: 40px;
}

.empty-title {
    margin-bottom: 6px;

    color: white;

    font-size: 19px;
    font-weight: 700;
}

.empty-description {
    max-width: 450px;

    font-size: 13px;
    line-height: 1.6;
}

/* PLAYER */

#player-container {
    position: fixed;

    inset: 0;

    z-index: 500;

    display: none;
    flex-direction: column;

    width: 100%;
    height: 100%;

    background: #000;
}

.player-bar {
    min-height: 58px;

    padding: 9px 12px;

    display: flex;
    align-items: center;

    gap: 8px;

    border-bottom: 1px solid var(--border);

    background: #111117;
}

.player-brand {
    margin-right: auto;

    display: flex;
    align-items: center;

    gap: 8px;

    font-size: 14px;
    font-weight: 700;
}

.player-brand-name {
    color: #c4b5fd;
}

.player-game-name {
    max-width: 340px;

    overflow: hidden;

    color: var(--muted);

    font-size: 12px;

    white-space: nowrap;
    text-overflow: ellipsis;
}

.player-btn {
    padding: 9px 13px;

    border: 1px solid var(--border);
    border-radius: 8px;

    cursor: pointer;

    color: white;

    font-size: 12px;
    font-weight: 600;

    background: #1a1a23;

    transition: background .15s ease;
}

.player-btn:hover {
    background: #252532;
}

#game-frame {
    flex: 1;

    width: 100%;
    height: 100%;

    border: none;

    background: black;
}

/* ANIMATION */

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* SCROLLBAR */

::-webkit-scrollbar {
    width: 8px;
}

::-webkit-scrollbar-track {
    background: var(--bg);
}

::-webkit-scrollbar-thumb {
    border-radius: 10px;

    background: #292934;
}

::-webkit-scrollbar-thumb:hover {
    background: #383846;
}

/* MOBILE */

@media (max-width: 760px) {

    .library-header {
        align-items: flex-start;
        flex-direction: column;
    }

    .player-game-name {
        display: none;
    }
}

@media (max-width: 600px) {

    header {
        padding: 32px 12px 25px;
    }

    .logo {
        font-size: 2.2rem;
    }

    .logo-icon {
        font-size: 1.9rem;
    }

    .library-header {
        padding: 0 12px;
    }

    #game-grid {
        padding: 0 12px 35px;

        grid-template-columns:
            repeat(
                2,
                minmax(0, 1fr)
            );

        gap: 10px;
    }

    .game-cover {
        padding: 8px;
    }

    .game-info {
        padding: 9px;
    }

    .game-title {
        font-size: 12px;
    }

    .play-btn {
        padding: 8px;

        font-size: 11px;
    }

    .player-brand {
        display: none;
    }

    .player-btn {
        flex: 1;
    }
}
</style>
</head>

<body>

<header id="header">

    <div class="logo-row">

        <span class="logo-icon">
            🎮
        </span>

        <div class="logo">
            UniversalGMS
        </div>

    </div>

    <div class="subtitle">
        Pick a game and play.
    </div>

    <div class="controls">

        <div class="search-container">

            <span class="search-icon">
                🔍
            </span>

            <input
                id="search"
                type="search"
                placeholder="Search games..."
                autocomplete="off"
            >

        </div>

    </div>

</header>


<section
    class="library-header"
    id="library-header"
>

    <div class="library-title-section">

        <div class="library-icon">
            🎮
        </div>

        <div class="library-title">
            Games
        </div>

    </div>

    <div id="status">

        <span class="loading-ring"></span>

        Loading...

    </div>

</section>


<main id="game-grid"></main>


<section id="player-container">

    <div class="player-bar">

        <div class="player-brand">

            🎮

            <span class="player-brand-name">
                UniversalGMS
            </span>

            <span
                class="player-game-name"
                id="player-game-name"
            ></span>

        </div>

        <button
            class="player-btn"
            id="exit-button"
            type="button"
        >
            ← Exit
        </button>

        <button
            class="player-btn"
            id="fullscreen-button"
            type="button"
        >
            ⛶ Fullscreen
        </button>

    </div>

    <iframe
        id="game-frame"
        title="UniversalGMS Game Player"
        allow="fullscreen; autoplay; gamepad"
        allowfullscreen
    ></iframe>

</section>


<script>

/* ==============================
   OFFLINE GAME SOURCE
============================== */

const GITLAB_PROJECT_ID =
    "86390728";

const GITLAB_BRANCH =
    "main";

const GITLAB_FOLDER =
    "Games";

const VERCEL_BASE_URL =
    "https://universaledu.vercel.app";


let allGames = [];


/* STATUS */

function setStatus(text, loading = false) {

    const status =
        document.getElementById("status");

    if (!status) {
        return;
    }

    if (loading) {

        status.innerHTML =
            '<span class="loading-ring"></span>' +
            escapeHTML(text);

    } else {

        status.textContent =
            text;

    }
}


/* HOSTED URL */

function makeHostedUrl(filePath) {

    const encodedPath =
        filePath
            .split("/")
            .map(
                part =>
                    encodeURIComponent(part)
            )
            .join("/");

    return `${VERCEL_BASE_URL}/${encodedPath}`;
}


/* GITLAB */

async function fetchRepositoryPage(page) {

    const parameters =
        new URLSearchParams({

            path: GITLAB_FOLDER,
            ref: GITLAB_BRANCH,
            recursive: "true",
            per_page: "100",
            page: String(page)

        });


    const apiUrl =
        `https://gitlab.com/api/v4/projects/${GITLAB_PROJECT_ID}/repository/tree?${parameters.toString()}`;


    const response =
        await fetch(apiUrl);


    if (!response.ok) {

        throw new Error(
            `GitLab API error ${response.status}`
        );

    }


    const files =
        await response.json();


    return {

        files,

        nextPage:
            response.headers.get(
                "x-next-page"
            )

    };
}


async function fetchAllRepositoryFiles() {

    const collectedFiles = [];

    let page = 1;


    while (true) {

        const result =
            await fetchRepositoryPage(page);


        collectedFiles.push(
            ...result.files
        );


        if (!result.nextPage) {
            break;
        }


        page =
            Number(result.nextPage);

    }


    return collectedFiles;
}


/* LOAD GAMES */

async function loadGames() {

    try {

        setStatus(
            "Loading...",
            true
        );


        const files =
            await fetchAllRepositoryFiles();


        const games = {};


        files.forEach(file => {

            if (file.type !== "blob") {
                return;
            }


            const parts =
                file.path.split("/");


            if (parts.length < 3) {
                return;
            }


            const folderName =
                parts[1];


            const fileName =
                parts[
                    parts.length - 1
                ];


            const lowerFileName =
                fileName.toLowerCase();


            if (!games[folderName]) {

                games[folderName] = {

                    name:
                        folderName,

                    url:
                        null,

                    cover:
                        null

                };

            }


            const hostedUrl =
                makeHostedUrl(
                    file.path
                );


            /* HTML GAME */

            if (
                lowerFileName.endsWith(
                    ".html"
                )
            ) {

                const expectedName =
                    `${folderName}.html`
                        .toLowerCase();


                if (
                    !games[folderName].url ||
                    lowerFileName ===
                        "index.html" ||
                    lowerFileName ===
                        expectedName
                ) {

                    games[folderName].url =
                        hostedUrl;

                }

            }


            /* COVER IMAGE */

            if (
                /\.(png|jpg|jpeg|webp|gif)$/i
                    .test(fileName)
            ) {

                const namedCover =
                    /^cover\.(png|jpg|jpeg|webp|gif)$/i
                        .test(fileName);


                if (
                    namedCover ||
                    !games[folderName].cover
                ) {

                    games[folderName].cover =
                        hostedUrl;

                }

            }

        });


        allGames =
            Object
                .values(games)

                .filter(
                    game =>
                        Boolean(game.url)
                )

                .sort(
                    (a, b) =>
                        a.name.localeCompare(
                            b.name
                        )
                );


        updateGameCount(
            allGames.length,
            false
        );


        renderGames(allGames);

    } catch (error) {

        console.error(
            "UniversalGMS loading error:",
            error
        );


        setStatus(
            "Load failed"
        );


        renderError(
            error.message
        );

    }
}


/* COUNT */

function updateGameCount(amount, searching) {

    if (searching) {

        setStatus(
            `${amount} ${
                amount === 1
                    ? "result"
                    : "results"
            }`
        );

        return;
    }


    setStatus(
        `${amount} ${
            amount === 1
                ? "game"
                : "games"
        }`
    );
}


/* GAME CARD */

function createGameCard(game) {

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "game-card";


    const coverContainer =
        document.createElement(
            "div"
        );


    coverContainer.className =
        "cover-container";


    const fallback =
        document.createElement(
            "div"
        );


    fallback.className =
        "cover-fallback";

    fallback.textContent =
        "🎮";


    if (game.cover) {

        const image =
            document.createElement(
                "img"
            );


        image.className =
            "game-cover";

        image.src =
            game.cover;

        image.alt =
            `${game.name} cover`;

        image.loading =
            "lazy";


        image.addEventListener(
            "error",
            function () {

                image.remove();

                fallback.style.display =
                    "flex";

            }
        );


        coverContainer.appendChild(
            image
        );

    } else {

        fallback.style.display =
            "flex";

    }


    coverContainer.appendChild(
        fallback
    );


    const gameInfo =
        document.createElement(
            "div"
        );


    gameInfo.className =
        "game-info";


    const title =
        document.createElement(
            "div"
        );


    title.className =
        "game-title";

    title.textContent =
        game.name;

    title.title =
        game.name;


    const play =
        document.createElement(
            "button"
        );


    play.className =
        "play-btn";

    play.type =
        "button";

    play.textContent =
        "Play";


    play.addEventListener(
        "click",
        function () {

            playGame(game);

        }
    );


    gameInfo.appendChild(
        title
    );

    gameInfo.appendChild(
        play
    );

    card.appendChild(
        coverContainer
    );

    card.appendChild(
        gameInfo
    );


    return card;
}


/* RENDER */

function renderGames(games) {

    const grid =
        document.getElementById(
            "game-grid"
        );


    grid.replaceChildren();


    if (games.length === 0) {

        grid.innerHTML = `
            <div class="empty-message">

                <div class="empty-icon">
                    🎮
                </div>

                <div class="empty-title">
                    No games found
                </div>

                <div class="empty-description">
                    Try a different search.
                </div>

            </div>
        `;

        return;
    }


    const fragment =
        document.createDocumentFragment();


    games.forEach(
        game => {

            fragment.appendChild(
                createGameCard(game)
            );

        }
    );


    grid.appendChild(
        fragment
    );
}


/* ERROR */

function renderError(message) {

    const grid =
        document.getElementById(
            "game-grid"
        );


    grid.innerHTML = `
        <div class="empty-message">

            <div class="empty-icon">
                ⚠️
            </div>

            <div class="empty-title">
                Couldn't load games
            </div>

            <div class="empty-description">
                ${escapeHTML(message)}
            </div>

        </div>
    `;
}


/* PLAYER */

function playGame(game) {

    if (!game || !game.url) {
        return;
    }


    document
        .getElementById("header")
        .style.display =
        "none";


    document
        .getElementById("library-header")
        .style.display =
        "none";


    document
        .getElementById("game-grid")
        .style.display =
        "none";


    document
        .getElementById("player-container")
        .style.display =
        "flex";


    document
        .getElementById("player-game-name")
        .textContent =
        `• ${game.name}`;


    document
        .getElementById("game-frame")
        .src =
        game.url;


    document.body.style.overflow =
        "hidden";
}


/* EXIT GAME */

function exitGame() {

    document
        .getElementById("game-frame")
        .src =
        "about:blank";


    document
        .getElementById("player-container")
        .style.display =
        "none";


    document
        .getElementById("header")
        .style.display =
        "block";


    document
        .getElementById("library-header")
        .style.display =
        "flex";


    document
        .getElementById("game-grid")
        .style.display =
        "grid";


    document.body.style.overflow =
        "";


    window.scrollTo(
        0,
        0
    );
}


/* FULLSCREEN */

async function fullscreenGame() {

    const frame =
        document.getElementById(
            "game-frame"
        );


    try {

        if (
            document.fullscreenElement
        ) {

            await document.exitFullscreen();

            return;
        }


        if (
            frame.requestFullscreen
        ) {

            await frame.requestFullscreen();

        } else if (
            frame.webkitRequestFullscreen
        ) {

            frame.webkitRequestFullscreen();

        }

    } catch (error) {

        console.error(
            "Fullscreen failed:",
            error
        );

    }
}


/* SEARCH */

document
    .getElementById("search")
    .addEventListener(
        "input",
        function (event) {

            const query =
                event.target.value
                    .trim()
                    .toLowerCase();


            const filtered =
                allGames.filter(
                    game =>
                        game.name
                            .toLowerCase()
                            .includes(query)
                );


            renderGames(
                filtered
            );


            updateGameCount(
                filtered.length,
                Boolean(query)
            );

        }
    );


/* BUTTONS */

document
    .getElementById("exit-button")
    .addEventListener(
        "click",
        exitGame
    );


document
    .getElementById("fullscreen-button")
    .addEventListener(
        "click",
        fullscreenGame
    );


/* ESC */

document.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Escape" &&
            !document.fullscreenElement
        ) {

            const player =
                document.getElementById(
                    "player-container"
                );


            if (
                player.style.display ===
                "flex"
            ) {

                exitGame();

            }

        }

    }
);


/* SAFE HTML */

function escapeHTML(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );
}


/* START */

window.addEventListener(
    "DOMContentLoaded",
    loadGames
);

</script>

</body>
</html>
